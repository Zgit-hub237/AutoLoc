spring.application.name=autoloc-api

# Profile used when none is explicitly activated (override with SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA: never modify the schema outside the dev profile
spring.jpa.hibernate.ddl-auto=validate
# LAZY associations must be loaded inside the transaction, not while rendering the HTTP response
spring.jpa.open-in-view=false

# Logs
logging.level.fr.ece.autoloc=INFO
